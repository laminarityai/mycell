# The classify and extract steps (runtime/lib/steps.ts). The spec's question, and the message or
# invite, come in as they are.

# A classify step's question, as the spec asks it.
classifyQuestion: |-
  {{question}}

extractSystem: |-
  Extract the fields from the text. Use null for a field the text doesn't give.

# The triggering item: a message's sender, subject and text, or an invite's details.
extractPrompt: |-
  {{message}}
