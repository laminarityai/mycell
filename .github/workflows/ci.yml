name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://mycel:mycel@localhost:5433/mycel
    # The same image as docker-compose.yml, so database tests run against the same Postgres.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: mycel
          POSTGRES_PASSWORD: mycel
          POSTGRES_DB: mycel
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mycel -d mycel"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # CI is this one script, so it checks exactly what a laptop checks.
      - run: pnpm verify
