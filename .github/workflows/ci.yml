name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://mycel:mycel@localhost:5433/mycel
      # Placeholders: CI builds and tests but never signs anyone in, so it needs no secrets.
      BETTER_AUTH_SECRET: ci-placeholder-secret-of-at-least-32-chars
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      NANGO_API_KEY: ci-placeholder
      NANGO_WEBHOOK_SIGNING_KEY: ci-placeholder
      INNGEST_EVENT_KEY: ci-placeholder
      INNGEST_SIGNING_KEY: signkey-ci-00000000000000000000000000000000
      INNGEST_ENCRYPTION_KEY: ci-placeholder-encryption-key-of-32-chars
      KMS_REGION: us-east-1
      AI_GATEWAY_API_KEY: ci-placeholder
      MODEL_CLASSIFY: typesafe-ai/jev-1.14.0
      MODEL_FAST: ci/fast
      MODEL_SMART: ci/smart
      MODEL_JUDGE: ci/judge
      MODEL_EMBED: ci/embed
    # The same image as docker-compose.yml, so database tests run against the same Postgres.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: mycel
          POSTGRES_PASSWORD: mycel
          POSTGRES_DB: mycel
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mycel -d mycel"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser the e2e tests in `pnpm verify` drive, with its system dependencies.
      - run: pnpm --filter app exec playwright install --with-deps chromium
      # CI is this one script, so it checks exactly what a laptop checks. The tests name their
      # databases and e2e port for the checkout (app/checkout-isolation.ts), as on a laptop.
      - run: pnpm verify
